#Using Network

services:
  db:
    image: postgres:13-alpine
    ports:
      - '${DB_PORT}:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    profiles: ['infra']
    networks:
      - backend_to_db
  backend:
    image: xuankhanhhoang/devops:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    profiles: ['app']
    env_file:
      - .env
    networks:
      - backend_to_db
      - backend_to_redis
      - backend_to_internet
  redis:
    image: redis:8.6.3-alpine
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    profiles: ['infra']
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - backend_to_redis

volumes:
  db_data:
  redis_data:
networks:
  backend_to_redis:
    driver: bridge
    internal: true
  backend_to_db:
    driver: bridge
    internal: true
  backend_to_internet:
# Default Settings is bridge
# Default Settings internal: false
