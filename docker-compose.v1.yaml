services:
  db:
    image: postgres:13-alpine
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
  web:
    build:
      context: .
      args:
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}
      dockerfile: Dockerfile-MultiStageBuild.dockerfile
      target: production
    image: devops-compose-v2
    volumes:
      - web_test_data:/abc
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
  web_test_data:
