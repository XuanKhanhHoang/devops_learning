name: 'pipeline-v1'

on:
  push:
    branches:
      - deploy
    paths:
      - 'src/**'
      - 'Dockerfile-Deploy.dockerfile'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 'Notify'
        run: echo "Deploying"

      - name: 'Pulling code'
        uses: actions/checkout@v4

      - name: 'Build image'
        run: docker build -f Dockerfile-Deploy.dockerfile -t learn_devops:deploy .

      - name: 'On failure'
        if: failure()
        run: echo "Build failure!"

      - name: 'On success'
        if: success()
        run: echo "Build success!"
