services:
  db:
    image: postgres:13-alpine
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
  web:
    image: devops:v2
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    env_file:
      - .env.build
volumes:
  db_data:
